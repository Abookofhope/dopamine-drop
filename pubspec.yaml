name: dopamine_drop
description: "Dopamine Drop: Brain Snacks - a rotating-mode puzzle game built for short attention spans."
publish_to: 'none'
version: 0.3.1+4

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Generates every Android and iOS launcher size from the two source images.
# The platform folders are not committed, so this runs after `flutter create .`:
#
#     flutter pub get && dart run flutter_launcher_icons
#
# Source art and the script that draws it live in assets/icon/.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  # Android composites the foreground over this, applies its own mask and
  # shadow, and animates the two layers apart. The mark already sits inside the
  # central 66% the mask guarantees to show, so it needs no extra inset.
  adaptive_icon_background: "#0D0918"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  # iOS rejects icons with an alpha channel.
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/sfx/

  # Bundled, not fetched. google_fonts pulls typefaces over the network at
  # runtime and does not reliably fall back when that fails — a first launch
  # with no signal rendered the entire game with no text at all.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
    - family: InstrumentSans
      fonts:
        - asset: assets/fonts/InstrumentSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/InstrumentSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/InstrumentSans-Bold.ttf
          weight: 700
    - family: MartianMono
      fonts:
        - asset: assets/fonts/MartianMono-Bold.ttf
          weight: 700
