# Builds the installable web app from site/app.html and publishes it to GitHub
# Pages. Runs on every push to main that touches the app, plus on demand.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Nothing else to configure.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-finished deploy would
# leave the site on the previous build with no indication why.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 tools/build_site.py _site

      - name: Check the build is actually loadable
        # The app caches itself offline the moment a phone opens it, so a
        # broken deploy is a bad page that installs itself. Kept as a script
        # rather than inline shell so it can be run locally before pushing.
        run: python3 tools/check_site.py _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
