# Builds the installable web app from web/app.html and publishes it to GitHub
# Pages. Runs on every push to main that touches the app, plus on demand.
#
# One-time setup: repository Settings -> Pages -> Build and deployment ->
# Source: "GitHub Actions". Nothing else to configure.
name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it: a half-finished deploy would
# leave the site on the previous build with no indication why.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 tools/build_site.py _site

      - name: Check the build is actually loadable
        # Cheap guards against publishing something broken. A syntax error in
        # the one source file would otherwise ship straight to the phone.
        run: |
          node --check <(sed -n '/<script>/,/<\/script>/p' _site/index.html \
            | sed '1d;$d')
          python3 -c "import json,sys; json.load(open('_site/manifest.webmanifest'))"
          node --check _site/sw.js
          test -s _site/icons/icon-192.png
          test -s _site/icons/maskable-512.png
          grep -q 'dopamine-drop-' _site/sw.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
